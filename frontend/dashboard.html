<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practenture Professor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        .header .user-info {
            color: #666;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card .label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            color: #333;
            font-size: 28px;
            font-weight: bold;
        }
        .sessions-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .sessions-section h2 {
            padding: 20px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .sessions-table {
            width: 100%;
            border-collapse: collapse;
        }
        .sessions-table th {
            background: #f8f9fa;
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            color: #555;
        }
        .sessions-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .sessions-table tr:hover {
            background: #f8f9fa;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background: #d1fae5;
            color: #059669;
        }
        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }
        .status-completed {
            background: #e5e7eb;
            color: #6b7280;
        }
        .progress-bar {
            width: 100px;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .action-btn.view {
            background: #667eea;
            color: white;
        }
        .action-btn.view:hover {
            background: #5a6fd6;
        }
        .action-btn.edit {
            background: #f59e0b;
            color: white;
        }
        .action-btn.edit:hover {
            background: #d97706;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><img src="logo.png" alt="Practenture Logo" style="height: 40px; vertical-align: middle; margin-right: 15px;">Practenture Professor Dashboard</h1>
            <div class="user-info" id="userInfo">Loading...</div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">Total Sessions</div>
                <div class="value" id="totalSessions">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Sessions</div>
                <div class="value" id="activeSessions">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Students</div>
                <div class="value" id="totalStudents">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Submissions</div>
                <div class="value" id="totalSubmissions">0</div>
            </div>
        </div>

        <div class="sessions-section">
            <h2>Your Sessions</h2>
            <table class="sessions-table">
                <thead>
                    <tr>
                        <th>Session Code</th>
                        <th>State</th>
                        <th>Current Round</th>
                        <th>Total Rounds</th>
                        <th>Teams</th>
                        <th>Submissions</th>
                        <th>Progress</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="sessionsTableBody">
                    <tr>
                        <td colspan="8" class="loading">Loading sessions...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'https://practenture.com'; // Update with your domain
        const TOKEN_KEY = 'practenture_token';

        // Get token from localStorage
        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }

        // Set token in localStorage
        function setToken(token) {
            localStorage.setItem(TOKEN_KEY, token);
        }

        // Clear token
        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
        }

        // Fetch sessions
        async function fetchSessions() {
            const token = getToken();
            if (!token) {
                showLogin();
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/dashboard/sessions`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 401) {
                    clearToken();
                    showLogin();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                renderSessions(data.sessions);
                updateStats(data.sessions);
            } catch (error) {
                console.error('Error fetching sessions:', error);
                document.getElementById('sessionsTableBody').innerHTML = 
                    '<tr><td colspan="8" class="error">Failed to load sessions. Please try again.</td></tr>';
            }
        }

        // Render sessions table
        function renderSessions(sessions) {
            const tbody = document.getElementById('sessionsTableBody');
            
            if (sessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading">No sessions found. Create one to get started!</td></tr>';
                return;
            }

            tbody.innerHTML = sessions.map(session => {
                const progress = Math.round((session.currentRound / session.totalRounds) * 100);
                const statusClass = session.state === 'active' ? 'status-active' :
                                   session.state === 'pending' ? 'status-pending' : 'status-completed';
                
                return `
                    <tr>
                        <td><strong>${session.code}</strong></td>
                        <td><span class="status-badge ${statusClass}">${session.state}</span></td>
                        <td>${session.currentRound}/${session.totalRounds}</td>
                        <td>${session.totalRounds}</td>
                        <td>${session.teamsCount} (AI: ${session.aiTeamsCount})</td>
                        <td>${session.totalSubmissions}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </td>
                        <td>
                            <button class="action-btn view" onclick="viewSession('${session.code}')">View</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Update stats
        function updateStats(sessions) {
            const totalSessions = sessions.length;
            const activeSessions = sessions.filter(s => s.state === 'active').length;
            const totalStudents = sessions.reduce((sum, s) => sum + s.teamsCount, 0);
            const totalSubmissions = sessions.reduce((sum, s) => sum + s.totalSubmissions, 0);

            document.getElementById('totalSessions').textContent = totalSessions;
            document.getElementById('activeSessions').textContent = activeSessions;
            document.getElementById('totalStudents').textContent = totalStudents;
            document.getElementById('totalSubmissions').textContent = totalSubmissions;
        }

        // Show login
        function showLogin() {
            document.getElementById('userInfo').innerHTML = 
                '<a href="#" onclick="login()" style="color: #667eea; text-decoration: none;">Login</a>';
            document.getElementById('sessionsTableBody').innerHTML = 
                '<tr><td colspan="8" class="error">Please login to view your dashboard.</td></tr>';
        }

        // Login function
        function login() {
            const username = prompt('Enter your username:');
            const password = prompt('Enter your password:');
            
            if (username && password) {
                fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.accessToken) {
                        setToken(data.accessToken);
                        document.getElementById('userInfo').innerHTML = 
                            `<span style="color: #666;">${data.username || 'Professor'}</span>`;
                        fetchSessions();
                    } else {
                        alert('Login failed. Please try again.');
                    }
                })
                .catch(error => {
                    console.error('Login error:', error);
                    alert('Login failed. Please try again.');
                });
            }
        }

        // View session
        function viewSession(sessionCode) {
            window.open(`https://practenture.com/session/${sessionCode}`, '_blank');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (token) {
                document.getElementById('userInfo').innerHTML = 
                    '<span style="color: #666;">Loading...</span>';
                fetchSessions();
            } else {
                showLogin();
            }
        });
    </script>
</body>
</html>
