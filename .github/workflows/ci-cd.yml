name: Practenture Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practenture-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PRACTENTURE_JWT_SECRET: "ci-only-secret-never-use-in-production"
  SECRET_KEY: "ci-only-secret-never-use-in-production"
  DATABASE_URL: "sqlite:////tmp/practenture-ci.db"

jobs:
  backend-contracts:
    name: Backend contracts, scenarios, and parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx requests
      - name: Compile Python
        run: python -m compileall -q .
      - name: Contract and simulation gates
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          rm -f /tmp/practenture-ci.db
          pytest -q \
            tests/contracts \
            tests/unit \
            test_simulation_formula_parity.py \
            test_simulation_invariants.py \
            tests/test_simulation_golden_parity.py \
            tests/test_migrations.py \
            --junitxml=pytest-contracts.xml \
            --cov=. --cov-report=xml:coverage.xml
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-evidence
          path: |
            backend/pytest-contracts.xml
            backend/coverage.xml

  backend-regression:
    name: Backend regression and 20-student simulation
    needs: backend-contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install pytest httpx requests
      - name: Regression suite (includes 20-student E2E)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          rm -f /tmp/practenture-ci.db
          pytest -q \
            test_backend.py \
            test_phase5.py \
            test_player_decision_contract.py \
            test_simulation.py \
            test_auth_comprehensive.py \
            test_auth_enrollment.py \
            test_auth_provider_security.py \
            test_ai.py \
            --junitxml=pytest-regression.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-evidence
          path: backend/pytest-regression.xml

  admin-v2-security:
    name: Admin V2 security and workflow contracts
    needs: backend-contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          pip install -r requirements.txt
          pip install pytest httpx requests
      - name: Admin API, authentication, and browser contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          rm -f /tmp/practenture-ci.db
          node --check static/admin_v2/admin-v2.js
          node --check static/admin_v2/admin-workspaces.js
          pytest -q tests/admin_v2 ../Tests/test_release_contracts.py --junitxml=pytest-admin-v2.xml
      - name: Scan the repository for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --no-banner --redact --config /repo/.gitleaks.toml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v2-security-evidence
          path: backend/pytest-admin-v2.xml

  ios-build-and-test:
    name: iOS build-for-testing and tests
    needs: backend-contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; rows=[x for runtime in d.values() for x in runtime if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(rows[-1]["udid"] if rows else "")')
          test -n "$UDID"
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Practenture.xcodeproj \
            -scheme Practenture \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/PractentureDerivedData" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/ios-build.log"
      - name: Test without rebuilding
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project Practenture.xcodeproj \
            -scheme Practenture \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/PractentureDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/PractentureTests.xcresult" | tee "$RUNNER_TEMP/ios-test.log"
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-evidence
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-test.log
            ${{ runner.temp }}/PractentureTests.xcresult

  docker-build:
    name: Reproducible backend image and Compose rehearsal
    needs: [backend-regression, admin-v2-security, ios-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: ${{ github.workspace }}/Dockerfile
          push: false
          load: true
          tags: practenture-backend:${{ github.sha }}
          build-args: |
            PRACTENTURE_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify deterministic source artifact
        run: |
          set -euo pipefail
          python3 scripts/build_release_artifact.py --root . --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release-a.tar.gz"
          python3 scripts/build_release_artifact.py --root . --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/release-b.tar.gz"
          cmp "$RUNNER_TEMP/release-a.tar.gz" "$RUNNER_TEMP/release-b.tar.gz"
      - name: Disposable migration, health, backup, and restore rehearsal
        env:
          PRACTENTURE_IMAGE_TAG: ${{ github.sha }}
          PRACTENTURE_OWNER_PASSWORD: CiOwnerPassword123!
          PRACTENTURE_PROFESSOR_PASSWORD: CiProfessorPassword123!
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -p practenture-ci down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -p practenture-ci run --rm --no-deps practenture-backend alembic upgrade head
          docker compose -p practenture-ci up -d --no-build --no-deps practenture-backend
          for attempt in $(seq 1 30); do
            [ "$(docker inspect practenture-backend --format '{{.State.Health.Status}}')" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect practenture-backend --format '{{.State.Health.Status}}')" = healthy ]
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          docker exec practenture-backend python -c "import sqlite3; a=sqlite3.connect('/data/practenture.db'); b=sqlite3.connect('/data/ci-backup.sqlite'); a.backup(b); assert b.execute('pragma integrity_check').fetchone()[0]=='ok'; assert b.execute('select version_num from alembic_version').fetchone()[0]=='006'; b.close(); a.close()"
          docker exec practenture-backend python -c "import sqlite3; c=sqlite3.connect('/data/ci-backup.sqlite'); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; c.close()"
