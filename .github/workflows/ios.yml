name: iOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - "platform=iOS Simulator,name=iPhone 16 Pro"
          - "platform=iOS Simulator,name=iPad Pro 13-inch (M4)"
        configuration:
          - Debug
          - Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ matrix.configuration }}-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ matrix.configuration }}-

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project BizSimAI.xcodeproj \
            -target BizSimAI \
            -configuration ${{ matrix.configuration }} \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project BizSimAI.xcodeproj \
            -scheme BizSimAI \
            -configuration ${{ matrix.configuration }} \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  archive:
    name: Archive & Upload
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fastlane
        run: |
          gem install fastlane -NV

      - name: Archive
        run: |
          fastlane gym \
            -project BizSimAI.xcodeproj \
            -scheme BizSimAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -output_name BizSimAI \
            -output_directory ./build \
            -archive_path ./build/BizSimAI.xcarchive \
            -export_method app-store \
            -skip_package_ipa false

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          fastlane deliver \
            -ipa ./build/BizSimAI.ipa \
            -skip_screenshots true \
            -skip_metadata true \
            -force true

  stale-pr-check:
    name: Stale PR Check
    runs-on: ubuntu-latest
    steps:
      - name: Check stale PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-pr-message: "This PR has been inactive for 14 days. Marking as stale."
          days-before-pr-stale: 14
          days-before-pr-close: 7
