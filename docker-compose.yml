services:
  practenture-backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: practenture-backend:${PRACTENTURE_IMAGE_TAG:-stable}
    container_name: practenture-backend
    restart: unless-stopped
    ports:
      # nginx is the only public entry point; retain loopback access for host diagnostics.
      - "127.0.0.1:8000:8000"
    volumes:
      - db-data:/data
    environment:
      - PRACTENTURE_DB_PATH=/data/practenture.db
      - PRACTENTURE_JWT_SECRET=${PRACTENTURE_JWT_SECRET:?PRACTENTURE_JWT_SECRET must be set}
      - PRACTENTURE_OWNER_USERNAME=${PRACTENTURE_OWNER_USERNAME:-owner}
      - PRACTENTURE_OWNER_PASSWORD=${PRACTENTURE_OWNER_PASSWORD:-}
      - PRACTENTURE_PROFESSOR_USERNAME=${PRACTENTURE_PROFESSOR_USERNAME:-professor}
      - PRACTENTURE_PROFESSOR_PASSWORD=${PRACTENTURE_PROFESSOR_PASSWORD:-practenture2026}
      - PRACTENTURE_JWT_EXPIRY_HOURS=${PRACTENTURE_JWT_EXPIRY_HOURS:-24}
      - PRACTENTURE_APPLE_AUDIENCE=${PRACTENTURE_APPLE_AUDIENCE:-}
      - PRACTENTURE_GOOGLE_AUDIENCE=${PRACTENTURE_GOOGLE_AUDIENCE:-}
      - PRACTENTURE_CORS_ORIGINS=${PRACTENTURE_CORS_ORIGINS:-http://localhost,http://localhost:8080,capacitor://}
      - PRACTENTURE_EMAIL_PROVIDER=${PRACTENTURE_EMAIL_PROVIDER:-}
      - PRACTENTURE_SES_REGION=${PRACTENTURE_SES_REGION:-us-east-1}
      - PRACTENTURE_SES_SENDER=${PRACTENTURE_SES_SENDER:-}
      - PRACTENTURE_PUBLIC_ORIGIN=${PRACTENTURE_PUBLIC_ORIGIN:-https://practenture.com}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: practenture-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-practenture.conf:/etc/nginx/conf.d/practenture.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/practenture:/var/www/practenture:ro
    depends_on:
      practenture-backend:
        condition: service_healthy

volumes:
  db-data:
    driver: local
