services:
  db-permissions:
    image: practenture-backend:${PRACTENTURE_IMAGE_TAG:-stable}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R bizsim:bizsim /data"]
    restart: "no"
    volumes:
      - db-data:/data

  practenture-backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: practenture-backend:${PRACTENTURE_IMAGE_TAG:-stable}
    container_name: practenture-backend
    restart: unless-stopped
    depends_on:
      db-permissions:
        condition: service_completed_successfully
    ports:
      # nginx is the only public entry point; retain loopback access for host diagnostics.
      - "127.0.0.1:8000:8000"
    volumes:
      - db-data:/data
    environment:
      - PRACTENTURE_DB_PATH=/data/practenture.db
      - PRACTENTURE_JWT_SECRET=${PRACTENTURE_JWT_SECRET:?PRACTENTURE_JWT_SECRET must be set}
      - PRACTENTURE_PROVIDER_JOB_ENCRYPTION_KEY=${PRACTENTURE_PROVIDER_JOB_ENCRYPTION_KEY:?PRACTENTURE_PROVIDER_JOB_ENCRYPTION_KEY must be set}
      - PRACTENTURE_OWNER_USERNAME=${PRACTENTURE_OWNER_USERNAME:-owner}
      - PRACTENTURE_OWNER_PASSWORD=${PRACTENTURE_OWNER_PASSWORD:?PRACTENTURE_OWNER_PASSWORD must be set}
      - PRACTENTURE_PROFESSOR_USERNAME=${PRACTENTURE_PROFESSOR_USERNAME:-professor}
      - PRACTENTURE_PROFESSOR_PASSWORD=${PRACTENTURE_PROFESSOR_PASSWORD:?PRACTENTURE_PROFESSOR_PASSWORD must be set}
      - PRACTENTURE_JWT_EXPIRY_HOURS=${PRACTENTURE_JWT_EXPIRY_HOURS:-24}
      - PRACTENTURE_APPLE_AUDIENCE=${PRACTENTURE_APPLE_AUDIENCE:-}
      - PRACTENTURE_APPLE_TEAM_ID=${PRACTENTURE_APPLE_TEAM_ID:-}
      - PRACTENTURE_APPLE_KEY_ID=${PRACTENTURE_APPLE_KEY_ID:-}
      - PRACTENTURE_APPLE_PRIVATE_KEY=${PRACTENTURE_APPLE_PRIVATE_KEY:-}
      - PRACTENTURE_GOOGLE_AUDIENCE=${PRACTENTURE_GOOGLE_AUDIENCE:-}
      - PRACTENTURE_CORS_ORIGINS=${PRACTENTURE_CORS_ORIGINS:-http://localhost,http://localhost:8080,capacitor://}
      - PRACTENTURE_EMAIL_PROVIDER=${PRACTENTURE_EMAIL_PROVIDER:-}
      - PRACTENTURE_SES_REGION=${PRACTENTURE_SES_REGION:-us-east-1}
      - PRACTENTURE_SES_SENDER=${PRACTENTURE_SES_SENDER:-}
      - PRACTENTURE_SES_CONFIGURATION_SET=${PRACTENTURE_SES_CONFIGURATION_SET:-}
      - PRACTENTURE_SES_SNS_TOPIC_ARN=${PRACTENTURE_SES_SNS_TOPIC_ARN:-}
      - PRACTENTURE_EMAIL_SUPPRESSION_KEY=${PRACTENTURE_EMAIL_SUPPRESSION_KEY:-}
      - PRACTENTURE_PUBLIC_ORIGIN=${PRACTENTURE_PUBLIC_ORIGIN:-https://practenture.com}
      - PRACTENTURE_BACKUP_ROOT=/data/admin-backups
      - PRACTENTURE_ADMIN_AUDIT_EXPORT_ROOT=/data/admin-audit-exports
      # Docker's default bridge allocations. Override with the exact nginx
      # network on hosts that use a custom address pool; never trust `*`.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: practenture-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-practenture.conf:/etc/nginx/conf.d/practenture.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/www/practenture:/var/www/practenture:ro
    depends_on:
      practenture-backend:
        condition: service_healthy

volumes:
  db-data:
    driver: local
