<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practenture Owner Console - Login Required</title>
    <meta name="description" content="Owner Console login for Practenture business simulation platform.">
    <script>
        // Check if user is authenticated via localStorage
        const token = localStorage.getItem('token');
        if (!token) {
            // Not authenticated - redirect to login
            window.location.href = '/owner/login';
        } else {
            // Try to verify token with backend
            fetch('/api/owner/system/database-health', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => {
                if (response.ok) {
                    // Token is valid - load dashboard
                    window.location.href = '/owner/dashboard';
                } else {
                    // Token is invalid - redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/owner/login';
                }
            })
            .catch(() => {
                // Network error - redirect to login
                localStorage.removeItem('token');
                window.location.href = '/owner/login';
            });
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
