<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practenture - Create Professor Invitation</title>
    <link rel="stylesheet" href="/static/owner/owner.css">
</head>
<body>
    <div class="container">
        <h1>Create Professor Invitation</h1>
        
        <form id="invitation-form" class="form-card">
            <div class="form-group">
                <label for="organization">Organization:</label>
                <select id="organization" required>
                    <!-- Organizations will be populated here -->
                </select>
            </div>

            <div class="form-group">
                <label for="intended_email">Intended Email:</label>
                <input type="email" id="intended_email" required placeholder="professor@university.edu">
            </div>

            <div class="form-group">
                <label for="expires_in_hours">Expires In (hours):</label>
                <input type="number" id="expires_in_hours" value="48" min="1" max="720">
                <small>Default: 48 hours</small>
            </div>

            <div class="form-group">
                <label for="max_uses">Max Uses:</label>
                <input type="number" id="max_uses" value="1" min="1" max="10">
            </div>

            <div class="form-group">
                <label for="notes">Notes (optional):</label>
                <textarea id="notes" rows="3"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Invitation</button>
                <a href="#/invitations" class="btn btn-secondary">Cancel</a>
            </div>
        </form>

        <div id="result" class="hidden">
            <h2>Invitation Created</h2>
            <div class="result-card">
                <p><strong>Invitation Code:</strong></p>
                <code id="invitation_code" class="code-block"></code>
                <p class="warning">Copy this code - it will not be shown again!</p>
            </div>
        </div>
    </div>

    <script src="/static/owner/invitation.js"></script>
</body>
</html>
