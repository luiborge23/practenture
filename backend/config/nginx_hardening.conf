# Nginx Hardening Configuration for Practenture
# Apply this to both staging and production environments

# ── Security Headers ─────────────────────────────────────────────────────────

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=()" always;

# ── HSTS (HTTP Strict Transport Security) ───────────────────────────────────

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── Rate Limiting ────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── Connection Limits ────────────────────────────────────────────────────────

limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn conn_limit 20;

# ── Timeout Settings ─────────────────────────────────────────────────────────

client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

# ── Compression ──────────────────────────────────────────────────────────────

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;

gzip_types
    application/manifest+json
    application/json
    application/vnd.api+json
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml;

# ── Security Headers for API Endpoints ───────────────────────────────────────

location /api/ {
    # Rate limiting
    limit_req zone=api_limit burst=20 nodelay;
    
    # Request size limits
    client_max_body_size 10M;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Proxy settings
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
}

# ── Owner Console Security ───────────────────────────────────────────────────

location /owner/ {
    # IP whitelist (optional - restrict to known IPs)
    # allow 192.168.1.0/24;
    # deny all;
    
    # Authentication
    auth_basic "Owner Console";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Rate limiting
    limit_req zone=login_limit burst=5 nodelay;
    
    alias /var/www/practenture/templates/;
}

# ── Login Endpoint Protection ────────────────────────────────────────────────

location /api/auth/login {
    # Stricter rate limiting for login
    limit_req zone=login_limit burst=5 nodelay;
    
    # Request size limits
    client_max_body_size 1M;
    
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ── Health Check (no security headers) ───────────────────────────────────────

location /health {
    access_log off;
    
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}

# ── Error Pages ──────────────────────────────────────────────────────────────

error_page 403 /errors/403.html;
error_page 404 /errors/404.html;
error_page 500 502 503 504 /errors/50x.html;

location /errors/ {
    internal;
    alias /var/www/practenture/errors/;
}

# ── Logging ──────────────────────────────────────────────────────────────────

log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

access_log /var/log/nginx/practenture-access.log security;
error_log /var/log/nginx/practenture-error.log warn;

# ── SSL Configuration (production only) ──────────────────────────────────────

ssl_protocols TLSv1.3 TLSv1.2;
ssl_prefer_server_ciphers on;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# ── OCSP Stapling (production only) ───────────────────────────────────────────

ssl_stapling on;
ssl_stapling_verify on;
