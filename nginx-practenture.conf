# HTTP to HTTPS redirect - api
server {
    listen 80;
    server_name api.practenture.com;
    return 301 https://$host$request_uri;
}

# HTTP to HTTPS redirect - www and root
server {
    listen 80;
    server_name www.practenture.com practenture.com;
    return 301 https://$host$request_uri;
}

# API HTTPS server
server {
    listen 443 ssl http2;
    server_name api.practenture.com;

    ssl_certificate /etc/letsencrypt/live/api.practenture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.practenture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    location / {
        proxy_pass http://practenture-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Frontend HTTPS server (www.practenture.com + practenture.com)
server {
    listen 443 ssl http2;
    server_name www.practenture.com practenture.com;

    ssl_certificate /etc/letsencrypt/live/www.practenture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.practenture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/practenture;
    index index.html;

    # Canonical Owner Console entry point.
    location = /admin {
        proxy_pass http://practenture-backend:8000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy URLs never expose dashboard HTML directly.
    location = /owner { return 308 /admin; }
    location = /owner/ { return 308 /admin; }

    # Owner API keeps its /api/owner prefix; the generic /api proxy strips /api.
    location /api/owner/ {
        proxy_pass http://practenture-backend:8000/api/owner/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other API calls retain the historical prefix-stripping behavior.
    location /api/ {
        proxy_pass http://practenture-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback must remain after exact admin/legacy/API locations.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static files for Owner Console - proxy to backend
    location /static/owner {
        proxy_pass http://practenture-backend:8000/static/owner;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
