# HTTP to HTTPS redirect - api
server {
    listen 80;
    server_name api.practenture.com;
    return 301 https://$host$request_uri;
}

# HTTP to HTTPS redirect - www and root
server {
    listen 80;
    server_name www.practenture.com practenture.com;
    return 301 https://$host$request_uri;
}

# API HTTPS server
server {
    listen 443 ssl http2;
    server_name api.practenture.com;

    ssl_certificate /etc/letsencrypt/live/api.practenture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.practenture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://practenture-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Frontend HTTPS server (www.practenture.com + practenture.com)
server {
    listen 443 ssl http2;
    server_name www.practenture.com practenture.com;

    ssl_certificate /etc/letsencrypt/live/www.practenture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.practenture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/practenture;
    index index.html;

    # Canonical Admin Console entry point. Keep the public /admin URL while
    # serving the hardened V2 shell; the legacy dashboard is no longer exposed.
    location = /admin {
        proxy_pass http://practenture-backend:8000/admin-v2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do not let legacy Admin subpaths fall through to the marketing SPA.
    # Recovery is part of the V2 shell and has no public direct-reset page.
    location ^~ /admin/ { return 308 /admin; }

    # Additive Admin V2 shell; resolve before the marketing SPA fallback.
    location = /admin-v2 {
        proxy_pass http://practenture-backend:8000/admin-v2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin-v2/ { return 308 /admin-v2; }

    # Professor onboarding and progress portal. These exact routes resolve
    # before the marketing SPA fallback.
    location = /login {
        proxy_pass http://practenture-backend:8000/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /login/ { return 308 /login; }
    location = /dashboard {
        proxy_pass http://practenture-backend:8000/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /dashboard/ { return 308 /dashboard; }

    # Legacy URLs never expose dashboard HTML directly.
    location = /owner { return 308 /admin; }
    location = /owner/ { return 308 /admin; }

    # The insecure legacy Owner control plane is retired. Fail at the edge as
    # well as in the application instead of relying on a downstream 404.
    location ^~ /api/owner/ { return 404; }

    # Preserve the complete canonical Admin V2 URI. The absence of a URI
    # suffix on proxy_pass is intentional and prevents prefix stripping.
    location /api/admin/v2/ {
        proxy_pass http://practenture-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve /api for the backend's canonical API routes. Prefix stripping
    # made the public professor login call a nonexistent /auth/login endpoint.
    location /api/ {
        proxy_pass http://practenture-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback must remain after exact admin/legacy/API locations.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Retire legacy console assets, including the direct-reset JavaScript.
    location ^~ /static/owner { return 404; }
    location ^~ /static/admin/ { return 404; }

    location /static/admin_v2/ {
        proxy_pass http://practenture-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/professor_portal/ {
        proxy_pass http://practenture-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
